[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hanji"
dynamic = ["version"]
description = "한글(HWP 5.0 / HWPX) 문서를 텍스트·마크다운·HTML·RAG 청크로 바꿔 주는 순수 파이썬 라이브러리"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["hwp", "hwpx", "hangul", "한글", "parser", "rag", "markdown"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Korean",
  "Topic :: Text Processing :: Markup",
  "Operating System :: OS Independent",
]
dependencies = ["olefile>=0.46"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hanji = "hanji.__main__:main"

[tool.hatch.version]
path = "src/hanji/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hanji"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
